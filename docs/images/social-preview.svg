<svg viewBox="0 0 1280 640" width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- GitHub social preview: 1280x640, generated by `mise run social`.
       The logo is referenced rather than duplicated, so it cannot drift. This
       file is only ever rasterized locally, never served, so the nested SVG
       reference is safe here in a way it is not in logo.svg itself.
       The background is opaque because transparency renders black on most
       social cards. -->
  <rect width="1280" height="640" fill="#FFFFFF"/>
  <image href="logo.svg" x="100" y="194" width="1080" height="252"/>
</svg>
