[package]
name = "gh-settings"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Axel H. <noirbizarre@gmail.com>"]
description = "Declarative GitHub repository settings for the GitHub CLI"
repository = "https://github.com/noirbizarre/gh-settings"
homepage = "https://github.com/noirbizarre/gh-settings"
documentation = "https://noirbizarre.github.io/gh-settings"
readme = "README.md"
keywords = ["github", "gh-extension", "settings", "declarative", "cli"]
categories = ["command-line-utilities", "development-tools"]

# gh-settings is distributed as a GitHub CLI extension and nothing else.
# Publishing to crates.io would create a second install path
# (`cargo install gh-settings`). Setting this makes `cargo publish` refuse
# outright, rather than leaving the decision to depend on a registry token
# happening to be absent.
publish = false

# The binary name is mandated by the GitHub CLI: an extension repository named
# `gh-settings` must ship a binary named `gh-settings` for `gh extension install`
# to work. See ADR-014.
[[bin]]
name = "gh-settings"
path = "src/main.rs"

[lib]
name = "gh_settings"
path = "src/lib.rs"

[dependencies]
# Errors & diagnostics
thiserror = "2"
miette = { version = "7", features = ["fancy"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
demand = "2"
owo-colors = "4"
strsim = "0.11"

# Async runtime. Only the pieces we need: we spawn `gh` subprocesses and join
# their results, we are not a server.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs"] }
async-trait = "0.1"

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `serde_yaml` was archived in 2024. `serde_norway` is the maintained fork, and
# is the same one gh-ship uses.
serde_norway = "0.9"
# `saphyr` is parsed *in addition* to serde, purely to build a byte-span index so
# that diagnostics can underline the exact offending node. See ADR-008.
saphyr = "0.0.11"
# Gives us the serde path (`repository.description`) of a deserialization failure,
# which we then resolve against the span index.
serde_path_to_error = "0.1"
schemars = "1"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["filters", "json"] }
predicates = "3"
pretty_assertions = "1"
regex-lite = "0.1.9"
rstest = "0.26"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
