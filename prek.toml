default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "end-of-file-fixer", exclude_types = ["rust"] },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace", exclude = "^tests/snapshots/.*\\.snap$" },
]

[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.21.0"

[[repos.hooks]]
id = "commitlint"
stages = ["commit-msg"]
additional_dependencies = ["@commitlint/config-conventional"]

[[repos]]
repo = "local"

# Suppressions are configured in .github/actionlint.yml, not here: the same
# file serves `mise run lint:actions`, so the two cannot disagree.
[[repos.hooks]]
id = "actionlint"
name = "actionlint"
language = "system"
entry = "actionlint"
files = "^\\.github/workflows/.*\\.ya?ml$"

[[repos.hooks]]
id = "typos"
name = "typos"
language = "system"
entry = "typos"
pass_filenames = false

[[repos.hooks]]
id = "fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all -- --check"
files = "\\.rs$"
pass_filenames = false

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets --all-features -- -D warnings"
files = "\\.rs$"
pass_filenames = false

# Documentation generated from the code: the JSON Schema (a public contract,
# ADR-007), the CLI reference, the per-resource permission table (ADR-015) and
# the action inputs table. A stale copy silently misleads — the permission table
# once claimed to be generated while being hand-maintained, which is exactly
# what this prevents.
[[repos.hooks]]
id = "generated-docs"
name = "generated documentation is up to date"
language = "system"
entry = "bash -c 'mise run docs:reference && git diff --exit-code -- docs/configuration.md docs/cli.md docs/authentication.md docs/actions.md schema/'"
# `action.yml` is in the list because its descriptions are spliced into
# docs/actions.md: editing it alone must still re-run the generator.
files = "^(src/|schema/|docs/|scripts/|action\\.yml$)"
pass_filenames = false

# A release asset `gh` cannot resolve makes the extension uninstallable on a
# user's machine, long after CI is green (ADR-014). Cheap to check here.
[[repos.hooks]]
id = "release-assets"
name = "release assets are resolvable by gh"
language = "system"
entry = "python3 scripts/check-release-assets.py"
files = "^(\\.github/workflows/publish-release\\.yaml|scripts/check-release-assets\\.py)$"
pass_filenames = false
