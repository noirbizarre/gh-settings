default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "end-of-file-fixer", exclude_types = ["rust"] },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace", exclude = "^tests/snapshots/.*\\.snap$" },
]

[[repos]]
repo = "https://github.com/alessandrojcm/commitlint-pre-commit-hook"
rev = "v9.21.0"

[[repos.hooks]]
id = "commitlint"
stages = ["commit-msg"]
additional_dependencies = ["@commitlint/config-conventional"]

[[repos]]
repo = "local"

# actionlint 1.7.7 does not yet know `environment.deployment`, a documented and
# supported key:
# https://docs.github.com/en/actions/how-tos/deploy/configure-and-manage-deployments/control-deployments
# Only that rule is suppressed; other unexpected keys are still reported.
# Remove the -ignore once actionlint ships support.
[[repos.hooks]]
id = "actionlint"
name = "actionlint"
language = "system"
entry = "actionlint -ignore 'unexpected key \"deployment\" for \"environment\" section'"
files = "^\\.github/workflows/.*\\.ya?ml$"

[[repos.hooks]]
id = "typos"
name = "typos"
language = "system"
entry = "typos"
pass_filenames = false

[[repos.hooks]]
id = "fmt"
name = "cargo fmt"
language = "system"
entry = "cargo fmt --all -- --check"
files = "\\.rs$"
pass_filenames = false

[[repos.hooks]]
id = "clippy"
name = "cargo clippy"
language = "system"
entry = "cargo clippy --all-targets --all-features -- -D warnings"
files = "\\.rs$"
pass_filenames = false

# Documentation generated from the code: the JSON Schema (a public contract,
# ADR-007), the CLI reference, and the per-resource permission table (ADR-015).
# A stale copy silently misleads — the permission table once claimed to be
# generated while being hand-maintained, which is exactly what this prevents.
[[repos.hooks]]
id = "generated-docs"
name = "generated documentation is up to date"
language = "system"
entry = "bash -c 'mise run docs:reference && git diff --exit-code -- docs/ schema/'"
files = "^(src/|schema/|docs/|scripts/)"
pass_filenames = false
