# Toolchain and task definitions.
#
# Tool versions are resolved to exact builds in `mise.lock`, which is
# committed. CI installs from these two files, so local runs and CI runs
# use identical tool versions — CI drives the tools directly rather than
# through the tasks defined below.
#
# Rust itself is intentionally not managed here: CI needs per-job components
# (rustfmt, clippy, llvm-tools-preview) and cross-compilation targets, which
# `dtolnay/rust-toolchain` handles better. `rust-toolchain.toml` pins the
# channel for both.

[settings]
# Resolve tools through mise.lock and keep it updated. Without this, the
# lockfile is ignored and `latest` really means latest.
lockfile = true

# Do not let mise adopt `rust-toolchain.toml`. Rust is installed by rustup
# locally and by `dtolnay/rust-toolchain` in CI, which handle per-job
# components and cross-compilation targets that mise does not. Leaving both
# in charge would have mise shadow the toolchain CI just installed.
idiomatic_version_file_enable_tools = []

[tools]
actionlint = "latest"
# actionlint silently skips its shellcheck integration when the binary is
# absent, so without this a local run is NOT the CI run. Runners ship it.
shellcheck = "latest"
prek = "latest"
typos = "latest"
uv = "latest"
git-cliff = "latest"
cargo-binstall = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-insta" = "latest"
# Rasterizes the SVG assets (see the `icons` and `social` tasks). Pure Rust, so
# it needs no system libraries and renders identically on every platform.
"cargo:resvg" = "latest"
# Flattens the wordmark <text> in logo.src.svg into paths (see the `logo`
# task), so the logo needs no font installed wherever it is displayed.
"cargo:usvg" = "latest"

# --- Everyday ---------------------------------------------------------------

[tasks.default]
description = "Run fmt, lint, lint:actions, build and test"
depends = ["fmt", "lint", "lint:actions", "build", "test"]

[tasks.build]
description = "Build the binary"
run = "cargo build"

[tasks.test]
description = "Run tests (accepts nextest selectors)"
raw_args = true
run = "cargo nextest run"

[tasks."test:live"]
description = "Run the live suite against GH_SETTINGS_TEST_REPO"
# Talks to a real repository, so it is opt-in twice over: the tests are
# `#[ignore]`d, and they skip unless GH_SETTINGS_TEST_REPO names a repository
# free of managed configuration.
run = "cargo nextest run --profile live --run-ignored all"
raw_args = true

[tasks."test:live:setup"]
description = "Create or repair a live-test sandbox repository"
# CI's sandbox belongs to CI: two actors sharing one repository do not
# interleave, they make each other's pre-flight refuse. Bring your own, and use
# this to build it — and to dig it out again when a crashed run leaves it dirty.
run = "./scripts/live-sandbox.sh"
raw_args = true

[tasks.cover]
description = "Run tests with coverage"
run = "cargo llvm-cov nextest"

[tasks.fmt]
description = "Format the code"
run = "cargo fmt --all"

[tasks.lint]
description = "Lint the code"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.spell]
description = "Check spelling"
run = "typos"

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"
# Rule suppressions live in .github/actionlint.yml, which actionlint picks up
# on its own — so this task and the prek hook cannot drift apart.
run = "actionlint .github/workflows/*.yaml"

[tasks.snapshots]
description = "Review and update insta snapshots interactively"
run = "cargo insta review"

# --- gh-settings itself -----------------------------------------------------

[tasks."gh-settings"]
description = "Run gh-settings from source"
raw_args = true
run = "cargo run --"

[tasks.setup]
description = "Install gh-settings locally"
run = "cargo install --path . --force"

[tasks.schema]
description = "Regenerate the published JSON Schema"
# The schema is a public contract (ADR-007) and is checked in CI, so it is
# generated rather than hand-written and committed alongside the code.
run = "cargo run --quiet -- schema > schema/v1/settings.json"

[tasks."schema:check"]
description = "Fail if the committed JSON Schema is out of date"
run = "cargo run --quiet -- schema | diff -u schema/v1/settings.json -"

[tasks.dogfood]
description = "Validate this repository's own gh-ship setup"
run = "gh ship validate"

# --- Documentation ----------------------------------------------------------

[tasks."docs:reference"]
description = "Regenerate every document derived from the code"
# The configuration reference comes from the JSON Schema, which itself comes
# from the Rust types; the CLI reference and the permission table come straight
# from the code. All three are committed and checked in CI, so documentation
# that describes the code cannot drift from it.
run = """
cargo run --quiet -- schema | python3 scripts/gen-reference.py > docs/configuration.md
cargo run --quiet -- internal cli > docs/cli.md
cargo run --quiet -- internal requirements | python3 scripts/splice.py docs/authentication.md
python3 scripts/gen-action-inputs.py | python3 scripts/splice.py docs/actions.md
"""

[tasks."docs:check"]
description = "Fail if any generated document is out of date"
# Only the generated paths: checking all of docs/ would fail on any
# hand-written page that happens to be uncommitted, which is every docs commit.
run = """
mise run docs:reference
git diff --exit-code --stat -- docs/configuration.md docs/cli.md docs/authentication.md docs/actions.md schema/
"""

[tasks.docs]
description = "Serve the documentation locally"
run = "uvx zensical serve"

[tasks."docs:build"]
description = "Build the documentation"
run = "uvx zensical build"

# --- Artwork ----------------------------------------------------------------
#
# None of these join `default`: they rewrite committed binaries, so a routine
# run would dirty the working tree every time. Run them when the artwork
# changes — `logo` after editing logo.src.svg, all three after editing
# icon.svg, since the logo embeds the mark and the social preview embeds the
# logo.

[tasks.logo]
description = "Rebuild docs/images/logo.svg from logo.src.svg"
# The wordmark is a <text> element in the source so it stays editable, but text
# renders only where Fira Sans is installed — and the logo is displayed on
# GitHub, on the documentation site and in the social card. usvg converts it to
# paths once, here, between the two fixups gen-logo.py exists for: inlining the
# mark, and restoring the viewBox usvg drops. Both are explained in that file.
run = """
python3 scripts/gen-logo.py inline docs/images/logo.src.svg \
  | usvg --font-family "Fira Sans" - -c \
  | python3 scripts/gen-logo.py viewbox > docs/images/logo.svg
echo "docs/images/logo.svg"
"""

[tasks.icons]
description = "Rasterize docs/images/icon.svg into the PNG sizes"
run = """
for size in 128 256 512; do
  resvg --width "$size" --height "$size" docs/images/icon.svg "docs/images/icon-$size.png"
  echo "docs/images/icon-$size.png"
done
"""

[tasks.social]
description = "Render the GitHub social preview image from the logo"
# GitHub has no API for the social preview, so this is generated here and
# uploaded by hand, once, under:
#   Settings -> General -> Social preview
#
# The canvas lives in social-preview.svg rather than being passed as flags:
# resvg scales to fit rather than padding, so --width 1280 --height 640 on a
# wide logo yields 1280x299, not GitHub's required 1280x640. The wrapper
# references logo.svg instead of copying it, so the two cannot drift.
run = """
resvg docs/images/social-preview.svg docs/images/social-preview.png
echo "docs/images/social-preview.png — upload under Settings > General > Social preview"
"""
