name: 📦 Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag being released
        required: true
        type: string

  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # `gh extension install` computes `<os>-<arch>` for the running machine and
  # picks the release asset whose name ends in it. A platform with no matching
  # asset is not a degraded install, it is a hard failure — so every platform
  # `gh` recognises needs a line here.
  #
  # `linux-amd64-musl` is the exception: `gh` has no musl platform string and
  # can never select it. It is built as a manual download for people on distros
  # without a compatible glibc, and is deliberately named so that it cannot
  # shadow the gnu build.
  build:
    name: 🏗️ ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,   runner: ubuntu-latest,  asset: linux-amd64,   cross: true }
          - { target: aarch64-unknown-linux-gnu,  runner: ubuntu-latest,  asset: linux-arm64,   cross: true }
          - { target: x86_64-unknown-linux-musl,  runner: ubuntu-latest,  asset: linux-amd64-musl, cross: true }
          - { target: x86_64-apple-darwin,        runner: macos-latest,   asset: darwin-amd64,  cross: false }
          - { target: aarch64-apple-darwin,       runner: macos-latest,   asset: darwin-arm64,  cross: false }
          - { target: x86_64-pc-windows-msvc,     runner: windows-latest, asset: windows-amd64, cross: false, ext: .exe }
          - { target: aarch64-pc-windows-msvc,    runner: windows-11-arm, asset: windows-arm64, cross: false, ext: .exe }
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly what is being released, not a branch tip that
          # may have moved since.
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # `cross` is only needed on the Linux cross-compilation legs, so it is
      # installed conditionally here rather than added to mise.toml, which
      # would pull it onto every runner in the matrix.
      - uses: taiki-e/install-action@cross
        if: matrix.cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Stage the asset
        shell: bash
        # `inputs.tag` reaches the shell through `env:` rather than being
        # interpolated into the script, so its contents can never be parsed as
        # shell. Only someone with write access can dispatch this workflow, so
        # this is defence in depth rather than a hole.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/gh-settings${{ matrix.ext }}" \
             "dist/gh-settings_${TAG}_${{ matrix.asset }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v7
        with:
          name: asset-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: 🚀 Publish
    needs: build
    runs-on: ubuntu-latest

    # This is the deployment. Declaring a `url:` registers it in the
    # repository's deployment list and links straight to what shipped.
    # The environment is `release` because that is where the release
    # secrets live.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}

    # This job neither dispatches workflows nor pushes commits that must
    # trigger CI, so the default token is enough. The release credentials —
    # the GitHub App minted in 🚢 Ship and 🚀 Prepare Release — are not
    # needed here, and not asking for them keeps this job least-privileged.
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: asset-*
          merge-multiple: true
          path: dist

      # The configuration schema is referenced by URL from users' settings
      # files. Shipping it as a release asset gives anyone pinning a version
      # something stable to point at, alongside the docs site copy.
      - name: Attach the JSON Schema
        run: cp schema/v1/settings.json "dist/settings.schema.json"

      - name: Checksums
        working-directory: dist
        # `--` so an asset whose name begins with a dash is treated as a
        # file rather than an option (shellcheck SC2035).
        run: sha256sum -- * > SHA256SUMS

      # The release already exists as a DRAFT: gh-ship created it before
      # dispatching this workflow, and will undraft it once we succeed.
      # That ordering is what lets assets land before anyone is notified.
      - name: Upload assets to the draft release
        env:
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

      # `uses: noirbizarre/gh-settings@v1` needs a ref that exists. The releases
      # themselves are tagged without a `v` prefix, which is this project's
      # convention and stays that way — but a workflow `uses:` clause is not
      # ours to name, and the Actions ecosystem universally pins `@vN`. So the
      # alias carries the prefix even though the release tags do not.
      #
      # It floats: every 1.x release moves it, which is the whole point of
      # pinning to a major. Nothing is moved before the assets are uploaded, so
      # the alias never points at a release that cannot be installed.
      - name: Move the floating major alias
        env:
          TAG: ${{ inputs.tag }}
        run: |
          major="${TAG%%.*}"

          # No `v0`. A 0.x major promises nothing, so an alias pinning to it
          # would offer stability the version number explicitly withholds.
          if [ "$major" = "0" ]; then
            echo "0.x: no floating alias, the major carries no compatibility promise"
            exit 0
          fi

          git tag -f "v${major}" "$TAG"
          git push --force origin "v${major}"
