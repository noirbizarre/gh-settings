name: ♻️ CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🕵️ Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The channel comes from the action ref, not rust-toolchain.toml,
      # and each job installs the components it needs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Tool versions come from mise.toml + mise.lock, so CI runs exactly
      # what `mise run default` runs locally.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          cache: true

      - name: Run hooks
        run: prek run --all-files --show-diff-on-failure

  test:
    name: 🧪 Tests (${{ matrix.os.name }})
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
            flag: linux
          - name: Windows
            runner: windows-latest
            flag: windows
          - name: macOS
            runner: macos-latest
            flag: macos
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      # nextest and llvm-cov are pinned by mise.lock rather than resolved
      # per-run, so a tool release cannot change CI behaviour on its own.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          cache: true

      - name: Run tests (with coverage)
        run: |
          cargo llvm-cov nextest --profile ci
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          # Flagging each leg keeps the three reports distinguishable, so a
          # partial upload is visible rather than looking like a coverage drop.
          flags: ${{ matrix.os.flag }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          directory: target/nextest/ci
          report_type: test_results

  # `rust-version` in Cargo.toml is a promise. Without a job that keeps it,
  # it drifts the first time anyone uses a newer language feature.
  msrv:
    name: 🧓 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --all-targets

  # Three documents are produced from the code and committed: the JSON Schema
  # (a published contract users reference by URL), the CLI reference, and the
  # per-resource permission table. A stale copy misleads silently — the
  # permission table once *claimed* to be generated while being hand-written,
  # which is precisely what this job now prevents.
  schema:
    name: 📐 Generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          cache: true

      - name: Regenerate everything derived from the code
        run: mise run docs:reference

      - name: Check the committed copies are up to date
        run: |
          if ! git diff --exit-code -- docs/ schema/; then
            echo "::error::Generated documentation is out of date. Run \`mise run docs:reference\` and commit the result."
            exit 1
          fi

      - name: Ensure `validate` needs no network, repo or auth
        run: |
          cargo build
          mkdir -p "$RUNNER_TEMP/isolated/.github"
          cd "$RUNNER_TEMP/isolated"
          printf 'version: 1\nlabels:\n  - name: bug\n    color: d73a4a\n' \
            > .github/settings.yml
          env -i "$GITHUB_WORKSPACE/target/debug/gh-settings" validate -R o/r

  # gh extensions with precompiled binaries need a binary named after the
  # extension. Getting this wrong makes it uninstallable on a *user's* machine
  # rather than in our CI (ADR-014), so it is checked on every run.
  extension:
    name: 🧩 Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify the binary name and that it runs
        run: |
          cargo build --release
          test -x target/release/gh-settings
          ./target/release/gh-settings --version
          ./target/release/gh-settings schema > /dev/null

      # Proving the local binary exists says nothing about the release assets,
      # which is the part that actually breaks installs. This reads the publish
      # workflow and checks the names it will produce are ones `gh` can resolve.
      - name: Verify the release assets are resolvable by gh
        run: python3 scripts/check-release-assets.py

  # gh-ship releases gh-settings. Its configuration and workflows must satisfy
  # the contract gh-ship enforces, or the release breaks at the worst moment.
  ship:
    name: 🚢 Ship setup
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship

      - name: Validate the release setup
        run: gh ship validate
