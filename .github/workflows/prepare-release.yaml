name: 🚀 Prepare Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Produce the artifact but do not commit or push
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    # An App installation token expires after one hour, and this job outliving
    # its own credentials would fail at whichever call came after it.
    timeout-minutes: 30

    # The App credentials live only in the `release` environment.
    # Preparing a release is not a deployment, so this gates secrets and reviews without registering one.
    # The deployment is publish-release.
    #
    # Load-bearing twice over: an environment *variable* resolves only in a job
    # declaring its environment, so without this `vars.APP_CLIENT_ID` would
    # silently expand to the empty string.
    environment:
      name: release
      deployment: false

    steps:
      # An installation token, minted for this job and revoked when it ends.
      # The private key never leaves the secret.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Full history *and* tags: git-cliff derives the next version from
          # the last tag, and a shallow clone has neither.
          fetch-depth: 0
          fetch-tags: true
          # The default GITHUB_TOKEN cannot trigger workflows, so a Release PR
          # it authors would show no CI results.
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # git-cliff is pinned by mise.lock: a changelog tool that changes
      # version between releases would silently change our release notes.
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          cache: true

      # --- versioning: ours, not gh-ship's ---------------------------------

      - name: Compute the next version
        id: version
        run: |
          set -euo pipefail

          # Compare against the last *tag*, not the version in Cargo.toml.
          # Cargo.toml already carries the version being prepared, so
          # comparing to it would report "no change" for the very first
          # release and make bootstrapping impossible.
          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          next_tag="$(git cliff --bumped-version)"

          # This project tags without a `v` prefix, so the tag and the version
          # are the same string. They stay separate outputs because the release
          # artifact keeps them separate: the tag convention is a project's own
          # choice, and gh-ship never derives one from the other.
          {
            echo "tag=$next_tag"
            echo "version=$next_tag"
          } >> "$GITHUB_OUTPUT"

          if [ "$last_tag" = "$next_tag" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new releasable commits since ${last_tag:-the beginning}."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Releasing ${last_tag:-<nothing>} -> $next_tag"
          fi
        env:
          # git-cliff use the github integration
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}


      - name: Generate the changelog
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git cliff --bump -o CHANGELOG.md

          # Release notes are scratch input for `jq --rawfile`, not a
          # source file. Keep them out of the worktree so `git add -A`
          # cannot commit them.
          git cliff --unreleased --bump --strip all -o "$RUNNER_TEMP/ship-notes.md"

          # The `## <version> - <date>` heading belongs to CHANGELOG.md. The
          # Release PR and the GitHub Release both carry the version in their
          # own title, so drop the first heading and the blank lines ahead of
          # it. The `0,/^## /` range stops at the first match, leaving later
          # `##` sections such as New Contributors alone.
          sed -i -e '0,/^## /{/^## /d}' -e '/./,$!d' "$RUNNER_TEMP/ship-notes.md"
        env:
          # git-cliff use the github integration
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Apply the version
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # Only the first `version =` belongs to [package].
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          cargo update --workspace

      # The published JSON Schema embeds the crate version in its `$comment`,
      # so a release that skipped this would ship a schema disagreeing with the
      # binary that generated it. CI checks the same thing on every push.
      - name: Regenerate the JSON Schema
        if: steps.version.outputs.changed == 'true'
        run: cargo run --quiet -- schema > schema/v1/settings.json

      # Installed before the commit, not after: both `gh ship sign` below and
      # the artifact validation at the end need it.
      - name: Install gh-ship
        run: gh extension install noirbizarre/gh-ship
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Commit and push
        if: steps.version.outputs.changed == 'true' && !inputs.dry_run
        run: |
          set -euo pipefail
          # Runners carry no git identity, and `git commit` refuses without
          # one. This identity is throwaway: the commit made here is replaced
          # by the signed one below, whose author and committer come from the
          # token instead — GitHub only signs a commit it is asked to create
          # with no identity of its own.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || \
            git commit -m "chore(release): ${{ steps.version.outputs.version }}"
          git push origin HEAD

      # A commit made on the runner is never signed, whatever token pushes it:
      # git signs with a key and there is no key here, while the token only
      # authenticates the push. `gh ship sign` re-creates the tip through the
      # API carrying no author, committer or signature — the only shape GitHub
      # will sign itself — and moves the branch onto the result. It exits
      # non-zero rather than leaving a silently unsigned commit behind.
      #
      # With no argument it signs the tip of the branch this run was dispatched
      # on, which is gh-ship's throwaway staging branch. The condition must
      # match the commit step exactly: signing a tip this run did not create
      # would re-create somebody else's commit.
      #
      # https://noirbizarre.github.io/gh-ship/workflows/#getting-a-verified-release-commit
      - name: Sign the release commit
        if: steps.version.outputs.changed == 'true' && !inputs.dry_run
        run: gh ship sign
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # --- the protocol ------------------------------------------------------

      - name: Write the release artifact
        run: |
          set -euo pipefail
          if [ "${{ steps.version.outputs.changed }}" != "true" ]; then
            jq -n '{schemaVersion: 1, changed: false}' > ship.release.json
          else
            jq -n \
              --arg version "${{ steps.version.outputs.version }}" \
              --arg tag     "${{ steps.version.outputs.tag }}" \
              --rawfile notes "$RUNNER_TEMP/ship-notes.md" \
              '{
                "$schema": "https://noirbizarre.github.io/gh-ship/schema/release/v1.json",
                schemaVersion: 1,
                changed: true,
                version: $version,
                tag: $tag,
                release: { notes: $notes }
              }' > ship.release.json
          fi
          cat ship.release.json

      - name: Validate the release artifact
        run: gh ship validate ship.release.json
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/upload-artifact@v7
        with:
          name: ship-release
          path: ship.release.json
          if-no-files-found: error
