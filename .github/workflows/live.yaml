name: 🌍 Live

# The stub suite asserts the shape of the requests we send. It cannot assert
# that GitHub accepts them, nor show what GitHub sends back — and both bugs
# fixed in 0.1.0 lived in exactly that gap. This runs the real thing.
#
# Three triggers, for three different questions:
#
#   push      did this change break against the real API? Within minutes of
#             landing, rather than at 04:17 the next morning.
#   schedule  did GitHub change under us? Nothing in this repository moves, so
#             only a clock can ask — which is what the permission drift test
#             needs.
#   dispatch  answer either on demand.
#
# Deliberately not on pull requests: a network-dependent, rate-limited job
# holding a credential has no business blocking someone's PR, forks cannot read
# the secret anyway, and every run mutates the one shared sandbox.

on:
  push:
    branches: [main]
    # A deny-list rather than an allow-list of `src/**`, `tests/**` and friends.
    # An allow-list fails silently: add a directory that matters, forget to list
    # it here, and coverage disappears with nothing to say so. This fails the
    # other way, by occasionally spending two minutes on a commit that did not
    # need it. Note a commit touching both docs and code still runs — the skip
    # needs *every* changed file to match.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "*.svg"
  schedule:
    # `paths-ignore` does not apply here, so this runs whatever changed —
    # including nothing at all, which is the case it exists for.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every test targets the same repository, so two runs would race each other.
# Deliberately no `github.ref` suffix, unlike ci.yaml: the sandbox is shared, so
# a push run and the nightly must queue rather than run side by side.
# Never cancel: a cancelled run leaves that repository part-way through a change.
concurrency:
  group: live
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  live:
    name: 🌍 Live suite
    runs-on: ubuntu-latest
    if: github.repository_owner == 'noirbizarre'
    timeout-minutes: 20

    # The sandbox credential lives here, alongside the release one.
    environment:
      name: live-test
      deployment: false

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.18
          cache: true

      - name: Run the live suite
        run: mise run test:live
        env:
          # A PAT: the resources under test need Administration: write, which
          # cannot be granted to GITHUB_TOKEN. See docs/authentication.md.
          GH_TOKEN: ${{ secrets.LIVE_TEST_TOKEN }}
          GH_SETTINGS_TEST_REPO: ${{ vars.LIVE_TEST_REPO }}

      # Cleanup runs from a destructor, so an ordinary test failure now leaves
      # nothing behind. A cancelled job, an OOM kill or the timeout below runs
      # no destructor at all, which is the case this still covers.
      - name: Report leftovers
        if: failure()
        run: |
          echo "::warning::The live suite failed. If the job was killed rather than failing a test, ${{ vars.LIVE_TEST_REPO }} may hold leftover configuration, which will make the next run refuse to start. Reset it with: scripts/live-sandbox.sh ${{ vars.LIVE_TEST_REPO }} --yes"
