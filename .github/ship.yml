# $schema: https://noirbizarre.github.io/gh-ship/schema/config/v1.json
# gh-ship configuration
# Docs: https://noirbizarre.github.io/gh-ship/configuration/
#
# gh-ship orchestrates the release; the version bump and the changelog are
# produced by the `prepare-release` workflow using git-cliff. If this file or
# the workflows it names stop satisfying the contract, `gh ship validate` fails
# in CI.

version: 1

release_branch: release/next

workflows:
  prepare: prepare-release
  publish: publish-release

pull_request:
  # The Release PR is squash-merged, and GitHub composes the squash commit from
  # this title. This repository lints its own commit messages with
  # commitlint/config-conventional, so the title has to be a Conventional
  # Commit — `Release 0.3.0` is a subject our own hooks reject. `cliff.toml`
  # skips `^chore\(release\):`, so it never reappears in the next changelog.
  title: "chore(release): {{ version }}"
  header: |
    This PR prepares the next release of gh-settings.

    The version bump and changelog were produced by the `prepare-release`
    workflow. Review the changelog, then merge — 🚢 Ship takes it from there.
  footer: |
    ---
    Generated automatically by [gh-ship](https://github.com/noirbizarre/gh-ship).
  labels: [release]
  # The default, stated because it is load-bearing: one pull request per
  # release for its whole life, so its number, comments and review state
  # survive every re-prepare.
  reuse: true

release:
  # Draft first, so the publish workflow can attach the binaries before anyone
  # watching the repository is notified. An extension whose release is
  # announced before its assets exist is an extension nobody can install.
  draft: true
