[profile.ci]
# Do not cancel the run on the first failure: we want the full picture
# of what broke, especially across the OS matrix.
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

# The live suite talks to a real repository, so it is `#[ignore]`d and never
# runs by accident. This profile runs those tests and nothing else.
#
# `fail-fast` stays on here, unlike CI: a live failure usually leaves the
# repository part-way through a change, and piling more mutations on top of an
# unknown state makes the diagnosis harder, not easier.
[profile.live]
default-filter = 'test(/^live_/)'
fail-fast = true
# One at a time: every test targets the same repository, so parallel runs would
# race each other rather than the code.
test-threads = 1
